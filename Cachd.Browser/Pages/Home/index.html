<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab — Cachd</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="home">
      <div class="top-bar">
        <div class="brand">
          <img
            src="cachd://assets/Logos/logot1.png"
            alt="Cachd logo"
            class="brand-logo"
          />
          <span>cachd</span>
        </div>

        <div class="top-right">
          <div class="top-label">YOUR SPACE ON THE WEB</div>

          <a
            href="cachd://settings/"
            class="settings-link"
            title="Settings"
            aria-label="Settings"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </a>
        </div>
      </div>

      <section class="hero">
        <div class="greeting">WELCOME BACK</div>

        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date"></div>

        <h1>What are you looking for?</h1>

        <form id="searchForm" class="search">
          <span class="search-icon">⌕</span>

          <input
            id="searchInput"
            type="text"
            placeholder="Search the web..."
            autocomplete="off"
            autofocus
          />

          <button type="submit">↵</button>
        </form>

        <div class="search-hint">SEARCH THE WEB <span>·</span> PRESS ENTER</div>
      </section>

      <section class="shortcuts">
        <div class="section-heading">
          <span>MOST VISITED</span>
          <span class="section-line"></span>
        </div>

        <div id="mostVisited" class="shortcut-grid">
          <div class="empty-shortcuts">
            Your most visited pages will appear here.
          </div>
        </div>
      </section>

      <footer>
        <span>POWERED BY <strong>CACHD</strong></span>
        <span>BUILT FOR YOUR NEXT MOVE.</span>
      </footer>
    </main>
  </body>
</html>
